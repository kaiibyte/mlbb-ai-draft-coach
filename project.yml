
name: MLBBDraftCoach

options:
  bundleIdPrefix: com.draftcoach
  deploymentTarget:
    iOS: "27.0"

targets:
  MLBBDraftCoach:
    type: application
    platform: iOS
    sources:
      - MLBBDraftCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.draftcoach.mlbbdraftcoach
        PRODUCT_NAME: MLBBDraftCoach
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "27.0"
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: "MLBB Draft Coach captures your screen with your permission to recognize draft picks, bans and turns."
