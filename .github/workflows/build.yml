
name: Build MLBB Draft Coach IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Check project files
        run: |
          ls -la
          test -f project.yml
          test -f MLBBDraftCoach/ContentView.swift
          test -f MLBBDraftCoach/MLBBDraftCoachApp.swift

      - name: Generate Xcode project
        run: |
          xcodegen generate
          test -d MLBBDraftCoach.xcodeproj
          xcodebuild -list -project MLBBDraftCoach.xcodeproj

      - name: Build iOS app
        run: |
          set -e
          xcodebuild \
            -project MLBBDraftCoach.xcodeproj \
            -scheme MLBBDraftCoach \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          set -e
          APP_PATH=$(find build/Build/Products/Release-iphoneos \
            -maxdepth 1 -name '*.app' -type d -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Built app not found."
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload MLBBDraftCoach.ipa
          ls -lh MLBBDraftCoach.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MLBBDraftCoach-IPA
          path: MLBBDraftCoach.ipa
          if-no-files-found: error
          retention-days: 7
