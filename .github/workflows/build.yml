
name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project MLBBDraftCoach.xcodeproj \
            -scheme MLBBDraftCoach \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -e
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MLBBDraftCoach.app Payload/
          zip -r MLBBDraftCoach-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MLBBDraftCoach-unsigned-IPA
          path: MLBBDraftCoach-unsigned.ipa
